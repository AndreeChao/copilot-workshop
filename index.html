<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>待辦清單</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="todo-card" aria-label="待辦清單">
        <header class="todo-header">
          <h1>待辦清單</h1>
          <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切換深色模式">
            <span id="theme-icon" aria-hidden="true">🌙</span>
            <span id="theme-label">深色模式</span>
          </button>
        </header>

        <form id="todo-form" class="todo-form" novalidate>
          <input
            id="todo-input"
            type="text"
            placeholder="新增待辦事項"
            aria-label="新增待辦事項"
            maxlength="200"
          />
          <button type="submit">新增</button>
        </form>

        <div class="filter-group" role="group" aria-label="待辦篩選">
          <button class="filter-btn active" type="button" data-filter="all">全部</button>
          <button class="filter-btn" type="button" data-filter="active">未完成</button>
          <button class="filter-btn" type="button" data-filter="completed">已完成</button>
        </div>

        <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

        <p id="empty-state" class="empty-state">還沒有任何待辦事項,新增一個吧!</p>

        <footer class="todo-footer">
          <span>未完成: <strong id="pending-count">0</strong> 項</span>
        </footer>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
